version: '3.8'

# ⚠️ 2026-09-02 安全修复：所有 secrets 改 ${ENV} 引用（.env 文件注入），禁止硬编码进 compose
# 曾在公开仓库泄露 JWT_SECRET/INTERNAL_TOKEN/Mongo密码/Redis密码——已轮换后务必更新 .env
# AI 能力（DashScope/Gemini）已于 2026-09-02 下线（key 泄露后直接删除，不再接入）
services:
  marketplace:
    build: .
    container_name: yuezhitong-marketplace
    restart: unless-stopped
    ports:
      - "${PORT:-8010}:8010"
    environment:
      MONGODB_URI: "${MONGODB_URI}"
      MONGODB_DB: "${MONGODB_DB:-yuezhitong}"
      REDIS_URL: "${REDIS_URL}"
      JWT_SECRET: "${JWT_SECRET}"
      INTERNAL_TOKEN: "${INTERNAL_TOKEN}"
      PORT: 8010
    networks:
      - yuezhitong-network

networks:
  yuezhitong-network:
    external: true
