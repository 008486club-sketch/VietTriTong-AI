worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;

    server {
        listen 80;
        server_name ai.yuezhitong.com yuezhitong.com www.yuezhitong.com docs.ai.yuezhitong.com;
        location / { return 301 https://$host$request_uri; }
    }

    server {
        listen 443 ssl;
        server_name ai.yuezhitong.com yuezhitong.com www.yuezhitong.com;
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location = /_nhealth { return 200 "OK"; add_header Content-Type text/plain; }
        location = / { return 307 /zh-CN; }

        location = /zh-CN/welcome {
            root /usr/share/nginx/html;
            try_files /welcome-dark.html =404;
            add_header Cache-Control "no-cache";
        }

        location = /vi/welcome {
            root /usr/share/nginx/html;
            try_files /welcome-dark-vi.html =404;
            add_header Cache-Control "no-cache";
        }

        location = /ai-image {
            root /usr/share/nginx/html;
            try_files /ai-image.html =404;
            add_header Cache-Control "no-cache";
        }

        location = /ai-image-vi {
            root /usr/share/nginx/html;
            try_files /ai-image-vi.html =404;
            add_header Cache-Control "no-cache";
        }

        location /marketplace { proxy_pass http://yuezhitong-marketplace:8010/marketplace; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /api/market/ { proxy_pass http://yuezhitong-marketplace:8010/api/market/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /api/ai/ { proxy_pass http://yuezhitong-ai:3010/ai/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header Authorization "Bearer 6SIYEflXz0pYFFc5S3uoCJz9nFX7KhTl00kXP64AM0m4aTxp"; }
        location /api/ { proxy_pass http://yuezhitong-server:3002/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
        location /demos/ { root /etc/nginx; add_header Cache-Control "public, max-age=86400"; }
        location / {
            sub_filter_types text/html;
            sub_filter_once off;
            sub_filter '<a class="px-3 py-2 text-sm font-medium text-foreground/80 transition-colors hover:text-foreground" href="/pricing">定价</a>' '<a class="px-3 py-2 text-sm font-medium text-foreground/80 transition-colors hover:text-foreground" href="/pricing">定价</a><a class="px-3 py-2 text-sm font-medium text-foreground/80 transition-colors hover:text-foreground" href="https://yuezhitong.com/seedance.html" target="_blank">AI视频</a><a class="px-3 py-2 text-sm font-medium text-foreground/80 transition-colors hover:text-foreground" href="/ai-image">AI生图</a><a class="px-3 py-2 text-sm font-medium text-foreground/80 transition-colors hover:text-foreground" href="/ai-social">AI发布</a><a class="px-3 py-2 text-sm font-medium text-foreground/80 transition-colors hover:text-foreground" href="https://ai.yuezhitong.com/marketplace" target="_blank">任务市场</a>';
            sub_filter '<h4 class="text-xs font-semibold uppercase tracking-wider text-muted-foreground">资源</h4>' '<h4 class="text-xs font-semibold uppercase tracking-wider text-muted-foreground">资源</h4><ul class="space-y-3"><li><a class="text-sm text-foreground/80 transition-colors hover:text-foreground" href="https://yuezhitong.com/about.html" target="_blank">关于我们</a></li><li><a class="text-sm text-foreground/80 transition-colors hover:text-foreground" href="https://yuezhitong.com/cases.html" target="_blank">客户案例</a></li></ul>';
            proxy_pass http://yuezhitong-web:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    server {
        listen 443 ssl;
        server_name docs.ai.yuezhitong.com;
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        root /usr/share/nginx/docs;
        index index.html;
        location / { try_files $uri $uri/ =404; }
    }
}
