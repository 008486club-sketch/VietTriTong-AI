name: Docker Build & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build marketplace image
      uses: docker/build-push-action@v6
      with:
        context: ./marketplace
        file: ./marketplace/Dockerfile
        push: false
        tags: viettritong/marketplace:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm install --no-audit --no-fund --ignore-scripts

    - name: Type check
      run: npm run type-check

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Check Markdown links
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        # 只查根目录对外文档。内部模块 README 有大量指向已删除文件的相对链接
        # 和示例 URL，纳入扫描会让这条检查永久红，等于训练所有人无视 CI。
        folder-path: '.'
        max-depth: 1
        use-quiet-mode: 'no'
        use-verbose-mode: 'yes'
    
    - name: Spell check docs
      # 只查根目录对外文档。codespell 是英文词典，"Nam"（越南）这类词会误报，
      # 故显式忽略；内部模块 README 不纳入，避免长期误报把 CI 变成背景噪音。
      run: |
        pip install --quiet codespell==2.4.3
        codespell README.md README_EN.md README_VI.md CONTRIBUTING.md MCP_INTEGRATION.md \
          --ignore-words-list nam
