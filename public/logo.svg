<svg width="500" height="180" viewBox="0 0 500 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Icon -->
  <g transform="translate(78,90)">
    <!-- Outer orbit ring -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="url(#g)" stroke-width="1" opacity="0.2"/>
    <!-- Inner orbit ring -->
    <circle cx="0" cy="0" r="34" fill="none" stroke="url(#g)" stroke-width="1.7" opacity="0.4"/>
    <!-- Central node -->
    <circle cx="0" cy="0" r="20" fill="url(#g)" opacity="0.9"/>
    <!-- Satellite nodes -->
    <circle cx="-34" cy="-17" r="10" fill="url(#g)" opacity="0.8"/>
    <circle cx="34" cy="-17" r="10" fill="url(#g)" opacity="0.8"/>
    <circle cx="-25" cy="25" r="8" fill="url(#g)" opacity="0.65"/>
    <circle cx="25" cy="25" r="8" fill="url(#g)" opacity="0.65"/>
    <!-- Connection lines -->
    <line x1="0" y1="0" x2="-34" y2="-17" stroke="url(#g)" stroke-width="1.4" opacity="0.45"/>
    <line x1="0" y1="0" x2="34" y2="-17" stroke="url(#g)" stroke-width="1.4" opacity="0.45"/>
    <line x1="0" y1="0" x2="-25" y2="25" stroke="url(#g)" stroke-width="1.1" opacity="0.35"/>
    <line x1="0" y1="0" x2="25" y2="25" stroke="url(#g)" stroke-width="1.1" opacity="0.35"/>
  </g>
  <!-- Text -->
  <text x="160" y="81" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#e2e8f0" letter-spacing="7">越智通</text>
  <text x="160" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#94a3b8" letter-spacing="3.5">VIỆT TRÍ THÔNG</text>
</svg>
