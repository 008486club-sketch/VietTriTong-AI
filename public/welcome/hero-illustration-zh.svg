<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 640" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="320" y2="640">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="50%" stop-color="#0f0f2a"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#f5d76e"/>
    </linearGradient>
    <radialGradient id="glow" cx="160" cy="280" r="120">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="320" height="640" rx="0" fill="url(#bg)"/>
  <circle cx="160" cy="280" r="120" fill="url(#glow)"/>

  <!-- Central AI Node -->
  <circle cx="160" cy="200" r="44" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.4"/>
  <circle cx="160" cy="200" r="36" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.6"/>
  <circle cx="160" cy="200" r="22" fill="url(#accent)" filter="url(#softGlow)"/>
  <text x="160" y="206" text-anchor="middle" fill="white" font-size="16" font-weight="700">AI</text>

  <!-- Orbiting mini nodes -->
  <circle cx="160" cy="130" r="8" fill="#3b82f6" opacity="0.7"/>
  <circle cx="210" cy="160" r="6" fill="#06b6d4" opacity="0.7"/>
  <circle cx="215" cy="230" r="7" fill="#3b82f6" opacity="0.7"/>
  <circle cx="120" cy="245" r="5" fill="#06b6d4" opacity="0.7"/>
  <circle cx="100" cy="170" r="6" fill="#3b82f6" opacity="0.7"/>
  <circle cx="185" cy="250" r="4" fill="#06b6d4" opacity="0.5"/>

  <!-- Connection lines -->
  <line x1="160" y1="170" x2="160" y2="138" stroke="url(#accent)" stroke-width="0.8" opacity="0.4"/>
  <line x1="182" y1="180" x2="206" y2="164" stroke="url(#accent)" stroke-width="0.8" opacity="0.4"/>
  <line x1="190" y1="215" x2="211" y2="227" stroke="url(#accent)" stroke-width="0.8" opacity="0.4"/>
  <line x1="140" y1="225" x2="123" y2="241" stroke="url(#accent)" stroke-width="0.8" opacity="0.4"/>
  <line x1="135" y1="185" x2="105" y2="173" stroke="url(#accent)" stroke-width="0.8" opacity="0.4"/>

  <!-- Vietnam Map Silhouette (simplified S-shape) -->
  <path d="M135 300 Q140 290 138 310 Q136 330 140 345 Q142 355 138 370 Q134 385 136 400 Q138 415 135 430 Q130 445 132 455 Q134 465 130 475 Q128 485 125 490 L120 495 Q118 490 120 480 Q122 465 115 455 Q110 445 112 430 Q114 415 108 400 Q105 385 108 370 Q110 360 106 345 Q104 330 108 310 Q110 295 105 290" fill="url(#accent)" opacity="0.15" stroke="url(#accent)" stroke-width="1.5"/>

  <!-- Platform cards below -->
  <!-- TikTok Card -->
  <g transform="translate(40, 340)">
    <rect width="110" height="70" rx="10" fill="#111122" stroke="#1e1e3a" stroke-width="1"/>
    <rect width="30" height="4" rx="2" x="12" y="14" fill="#ff0050"/>
    <text x="50" y="17" fill="#ccc" font-size="9" font-weight="600">TikTok</text>
    <text x="12" y="35" fill="#889" font-size="8">AI内容创作</text>
    <text x="12" y="48" fill="#889" font-size="8">自动发布</text>
    <rect width="22" height="4" rx="2" x="12" y="56" fill="#06b6d4" opacity="0.8"/>
  </g>

  <!-- Video Card -->
  <g transform="translate(170, 340)">
    <rect width="110" height="70" rx="10" fill="#111122" stroke="#1e1e3a" stroke-width="1"/>
    <rect width="30" height="4" rx="2" x="12" y="14" fill="#3b82f6"/>
    <text x="50" y="17" fill="#ccc" font-size="9" font-weight="600">AI视频</text>
    <text x="12" y="35" fill="#889" font-size="8">Seedance 2.0</text>
    <text x="12" y="48" fill="#889" font-size="8">15秒→3分钟</text>
    <rect width="22" height="4" rx="2" x="12" y="56" fill="#06b6d4" opacity="0.8"/>
  </g>

  <!-- Social Card -->
  <g transform="translate(40, 425)">
    <rect width="110" height="70" rx="10" fill="#111122" stroke="#1e1e3a" stroke-width="1"/>
    <circle cx="22" cy="18" r="7" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="15" cy="16" r="2" fill="#06b6d4"/>
    <circle cx="22" cy="13" r="2" fill="#06b6d4"/>
    <circle cx="28" cy="18" r="2" fill="#06b6d4"/>
    <text x="50" y="17" fill="#ccc" font-size="9" font-weight="600">多平台</text>
    <text x="12" y="35" fill="#889" font-size="8">15+平台</text>
    <text x="12" y="48" fill="#889" font-size="8">一键发布</text>
    <rect width="22" height="4" rx="2" x="12" y="56" fill="#06b6d4" opacity="0.8"/>
  </g>

  <!-- Payment Card -->
  <g transform="translate(170, 425)">
    <rect width="110" height="70" rx="10" fill="#111122" stroke="#1e1e3a" stroke-width="1"/>
    <text x="16" y="18" fill="url(#gold)" font-size="13">¥</text>
    <text x="50" y="17" fill="#ccc" font-size="9" font-weight="600">降本增效</text>
    <text x="12" y="35" fill="#889" font-size="8">降低60%+</text>
    <text x="12" y="48" fill="#889" font-size="8">内容成本</text>
    <rect width="22" height="4" rx="2" x="12" y="56" fill="#06b6d4" opacity="0.8"/>
  </g>

  <!-- Top banner -->
  <rect x="60" y="510" width="200" height="32" rx="16" fill="#111122" stroke="url(#accent)" stroke-width="1"/>
  <text x="160" y="531" text-anchor="middle" fill="#d4af37" font-size="10" font-weight="600">🚀 BytePlus · Seedance 2.0</text>

  <!-- Bottom stats -->
  <g transform="translate(50, 555)">
    <text x="0" y="20" fill="#ccc" font-size="18" font-weight="700">70%</text>
    <text x="0" y="36" fill="#889" font-size="9">降低成本</text>
  </g>
  <g transform="translate(145, 555)">
    <text x="0" y="20" fill="#ccc" font-size="18" font-weight="700">15+</text>
    <text x="0" y="36" fill="#889" font-size="9">支持平台</text>
  </g>
  <g transform="translate(240, 555)">
    <text x="0" y="20" fill="#ccc" font-size="18" font-weight="700">3-7</text>
    <text x="0" y="36" fill="#889" font-size="9">天部署上线</text>
  </g>

  <!-- Pulse dots -->
  <circle cx="160" cy="200" r="44" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.3">
    <animate attributeName="r" from="44" to="60" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.3" to="0" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
