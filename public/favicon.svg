<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
  <g transform="translate(200,150)">
    <!-- Outer orbit ring -->
    <circle cx="0" cy="0" r="72" fill="none" stroke="url(#g)" stroke-width="1.4" opacity="0.2"/>
    <!-- Inner orbit ring -->
    <circle cx="0" cy="0" r="48" fill="none" stroke="url(#g)" stroke-width="2.4" opacity="0.4"/>
    <!-- Central node -->
    <circle cx="0" cy="0" r="28" fill="url(#g)" opacity="0.9"/>
    <!-- Satellite nodes -->
    <circle cx="-48" cy="-24" r="14" fill="url(#g)" opacity="0.8"/>
    <circle cx="48" cy="-24" r="14" fill="url(#g)" opacity="0.8"/>
    <circle cx="-36" cy="36" r="11" fill="url(#g)" opacity="0.65"/>
    <circle cx="36" cy="36" r="11" fill="url(#g)" opacity="0.65"/>
    <!-- Connection lines -->
    <line x1="0" y1="0" x2="-48" y2="-24" stroke="url(#g)" stroke-width="2" opacity="0.45"/>
    <line x1="0" y1="0" x2="48" y2="-24" stroke="url(#g)" stroke-width="2" opacity="0.45"/>
    <line x1="0" y1="0" x2="-36" y2="36" stroke="url(#g)" stroke-width="1.6" opacity="0.35"/>
    <line x1="0" y1="0" x2="36" y2="36" stroke="url(#g)" stroke-width="1.6" opacity="0.35"/>
  </g>
</svg>
