<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1600">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="2560" height="1600" fill="url(#bg2)"/>
  <text x="1280" y="400" text-anchor="middle" font-size="48" font-weight="700" fill="#d4af37" font-family="system-ui">Tạo Video Chuyên nghiệp bằng AI</text>
  <!-- Step 1 -->
  <circle cx="480" cy="800" r="70" fill="url(#purple)"/>
  <text x="480" y="820" text-anchor="middle" font-size="50">📝</text>
  <text x="480" y="920" text-anchor="middle" font-size="24" fill="rgba(255,255,255,0.8)" font-weight="600" font-family="system-ui">Lên kế hoạch</text>
  <!-- Arrow -->
  <text x="700" y="820" text-anchor="middle" font-size="40" fill="#d4af37">→</text>
  <!-- Step 2 -->
  <circle cx="960" cy="800" r="70" fill="url(#gold2)"/>
  <text x="960" y="820" text-anchor="middle" font-size="50">🎬</text>
  <text x="960" y="920" text-anchor="middle" font-size="24" fill="rgba(255,255,255,0.8)" font-weight="600" font-family="system-ui">Tạo video</text>
  <!-- Arrow -->
  <text x="1180" y="820" text-anchor="middle" font-size="40" fill="#d4af37">→</text>
  <!-- Step 3 -->
  <circle cx="1440" cy="800" r="70" fill="url(#green)"/>
  <text x="1440" y="820" text-anchor="middle" font-size="50">✨</text>
  <text x="1440" y="920" text-anchor="middle" font-size="24" fill="rgba(255,255,255,0.8)" font-weight="600" font-family="system-ui">Tối ưu hóa</text>
  <!-- Arrow -->
  <text x="1660" y="820" text-anchor="middle" font-size="40" fill="#d4af37">→</text>
  <!-- Step 4 -->
  <circle cx="1920" cy="800" r="70" fill="url(#pink)"/>
  <text x="1920" y="820" text-anchor="middle" font-size="50">🚀</text>
  <text x="1920" y="920" text-anchor="middle" font-size="24" fill="rgba(255,255,255,0.8)" font-weight="600" font-family="system-ui">Đăng tự động</text>
</svg>