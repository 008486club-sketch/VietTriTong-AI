<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1600">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#b8922e"/>
    </linearGradient>
  </defs>
  <rect width="2560" height="1600" fill="url(#bg1)"/>
  <!-- Center card -->
  <rect x="880" y="400" width="800" height="800" rx="32" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
  <!-- Platform icons row -->
  <g transform="translate(980,500)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="rgba(255,255,255,0.12)"/>
    <text x="40" y="54" text-anchor="middle" font-size="40">📱</text>
  </g>
  <g transform="translate(1090,500)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="rgba(255,255,255,0.12)"/>
    <text x="40" y="54" text-anchor="middle" font-size="40">🎵</text>
  </g>
  <g transform="translate(1200,500)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="rgba(255,255,255,0.12)"/>
    <text x="40" y="54" text-anchor="middle" font-size="40">📺</text>
  </g>
  <g transform="translate(1310,500)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="rgba(255,255,255,0.12)"/>
    <text x="40" y="54" text-anchor="middle" font-size="40">🐦</text>
  </g>
  <g transform="translate(1420,500)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="rgba(255,255,255,0.12)"/>
    <text x="40" y="54" text-anchor="middle" font-size="40">📸</text>
  </g>
  <!-- Arrow + Hub + Arrow -->
  <text x="1120" y="680" text-anchor="middle" font-size="40" fill="#d4af37">→</text>
  <circle cx="1280" cy="666" r="60" fill="url(#gold)"/>
  <text x="1280" y="686" text-anchor="middle" font-size="42" font-weight="900" fill="#1a1a2e">AI</text>
  <text x="1440" y="680" text-anchor="middle" font-size="40" fill="#d4af37">→</text>
  <!-- Title -->
  <text x="1280" y="800" text-anchor="middle" font-size="52" font-weight="700" fill="#d4af37" font-family="system-ui">Đăng một lần, Xuất bản khắp nơi</text>
  <text x="1280" y="860" text-anchor="middle" font-size="26" fill="rgba(255,255,255,0.5)" font-family="system-ui">Một nội dung — đồng loạt xuất hiện trên hơn 14 nền tảng</text>
</svg>